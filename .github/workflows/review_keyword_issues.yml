name: Review keyword GitHub issues

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ctee-keyword-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event.issue.pull_request == null && (github.event.comment.body == '/approve' || github.event.comment.body == '/reject')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate GitHub review and update keywords
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python viewer/review_keyword_issue.py
      - name: Commit keyword edits only
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/ctee-review-result.json || exit 0
          if git diff --quiet -- keywords.txt; then
            echo "No keyword changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.txt
          git commit -m "keywords: approve GitHub issue"
          git push origin HEAD:master
      - name: Record decision on the GitHub issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          path = Path('/tmp/ctee-review-result.json')
          if not path.is_file():
              raise SystemExit('No review result to finalize')
          info = json.loads(path.read_text(encoding='utf-8'))
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{info['number']}"
          headers = {
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'ctee-keyword-review',
          }
          def req(url, method, body):
              payload = json.dumps(body, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=20) as resp:
                  return resp.status
          decision = info['decision']
          text = ('已核准並寫入 GitHub keywords.txt。' if decision == 'approved'
                  else '已駁回，GitHub keywords.txt 未修改。')
          req(base + '/comments', 'POST', {'body': text})
          req(base, 'PATCH', {'state': 'closed',
                              'state_reason': 'completed' if decision == 'approved' else 'not_planned'})
          print(text)
          PY
