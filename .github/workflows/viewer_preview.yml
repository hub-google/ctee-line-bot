name: Preview CTEE Viewer and Send LINE Test

on:
  push:
    branches: [master]
    paths:
      - 'viewer/**'
      - '.github/workflows/viewer_preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctee-viewer-preview
  cancel-in-progress: true

jobs:
  viewer-test:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build gallery from real CTEE clippings
        env:
          CTEE_USER: ${{ secrets.CTEE_USER }}
          CTEE_PASS: ${{ secrets.CTEE_PASS }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python viewer/build_preview.py
      - name: Publish new viewer only to preview branch
        shell: bash
        run: |
          set -e
          git config user.name github-actions\[bot\]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin viewer-preview
          git worktree add /tmp/preview-files origin/viewer-preview
          cp -R viewer/public/. /tmp/preview-files/viewer/public/
          cd /tmp/preview-files
          git add viewer/public
          git commit -m 'preview: publish clipping reader output'
          git push origin HEAD:viewer-preview
      - name: Verify external static site and notify LINE
        env:
          SITE_URL: https://ctee-viewer-preview.pages.dev/
          EXPECTED_REF: ${{ github.sha }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python viewer/send_preview.py
