name: Preview CTEE Viewer (manual)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/viewer_preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ctee-viewer-manual
  cancel-in-progress: true

jobs:
  viewer-preview:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build gallery (old LINE push is disabled in this job)
        env:
          CTEE_USER: ${{ secrets.CTEE_USER }}
          CTEE_PASS: ${{ secrets.CTEE_PASS }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python viewer/build_preview.py
      - name: Save preview as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-static-preview
          path: viewer/public/
          retention-days: 3
      - name: Configure GitHub Pages (requires Pages enabled in repository settings)
        uses: actions/configure-pages@v5
      - name: Upload Pages static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/public/
      - name: Deploy GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify published site and push one LINE test
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
          EXPECTED_REF: ${{ github.sha }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python viewer/send_preview.py
