name: One-time Resend Official CTEE LINE Flex

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/line_manual_resend_20261118.yml'

permissions:
  contents: read

jobs:
  send-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install requests==2.32.3
      - name: Verify current archived viewer and resend LINE Flex once
        env:
          SITE_URL: https://hub-google.github.io/ctee-line-bot/
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
          LINE_VALIDATE_ONLY: '0'
        run: python viewer/send_preview.py
