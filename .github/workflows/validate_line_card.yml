name: Validate CTEE LINE card without sending

on:
  push:
    branches: [master]
    paths:
      - viewer/send_preview.py
      - .github/workflows/validate_line_card.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LINE validation dependency
        run: pip install requests==2.32.5
      - name: Validate the official LINE Flex payload only
        env:
          SITE_URL: https://hub-google.github.io/ctee-line-bot/
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
          LINE_VALIDATE_ONLY: "1"
        run: python viewer/send_preview.py
