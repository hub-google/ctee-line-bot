name: One-time LINE Flex recheck

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/viewer_line_recheck.yml'

permissions:
  contents: read

jobs:
  line-flex-recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HTTP client
        run: python -m pip install requests==2.32.3
      - name: Verify existing GitHub Pages archive and push formal Flex test
        env:
          SITE_URL: https://hub-google.github.io/ctee-line-bot/
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
        run: python viewer/send_preview.py
