name: Publish keyword suggestion page

on:
  push:
    branches: [master]
    paths:
      - viewer/public/keywords.html
      - supabase/functions/ctee-keywords/index.ts
      - viewer/send_preview.py
      - .github/workflows/daily_ctee.yml
      - ctee_downloader_cloud.py
      - .github/workflows/publish_keywords.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ctee-keyword-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate LINE Python and keyword page JavaScript
        run: |
          python -m py_compile viewer/send_preview.py ctee_downloader_cloud.py
          python - <<'PY'
          from pathlib import Path
          html = Path("viewer/public/keywords.html").read_text(encoding="utf-8")
          assert "<script type=\"module\">" in html and "</script>" in html
          code = html.split('<script type="module">', 1)[1].split("</script>", 1)[0]
          Path("/tmp/ctee-keywords.mjs").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/ctee-keywords.mjs
      - name: Verify Supabase-only frontend and crawler, and live read API
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import urllib.request
          page = Path('viewer/public/keywords.html').read_text(encoding='utf-8')
          crawler = Path('ctee_downloader_cloud.py').read_text(encoding='utf-8')
          endpoint = 'https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/ctee-keywords'
          assert endpoint in page and endpoint in crawler
          assert 'api.github.com/repos/' not in page
          assert 'setInterval(' not in page
          assert 'keywords.txt' not in crawler
          req = urllib.request.Request(endpoint, headers={'Origin':'https://hub-google.github.io'})
          with urllib.request.urlopen(req, timeout=20) as response:
              result = json.load(response)
              assert response.headers.get('Access-Control-Allow-Origin') == 'https://hub-google.github.io'
          assert result.get('ok') is True and isinstance(result.get('keywords'),list)
          assert len(result['keywords']) > 0
          assert all(isinstance(word,str) and word.strip() for word in result['keywords'])
          print('Supabase API available: %d keywords' % len(result['keywords']))
          PY
      - name: End-to-end review test (remove test keyword after run)
        run: python viewer/test_ctee_supabase_e2e.py
      - name: Update persistent gallery with keyword page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin viewer-archive
          git worktree add --detach /tmp/ctee-keyword-site origin/viewer-archive
          cp viewer/public/keywords.html /tmp/ctee-keyword-site/viewer/public/keywords.html
          cd /tmp/ctee-keyword-site
          git add viewer/public/keywords.html
          if ! git diff --cached --quiet; then
            git commit -m "site: publish keyword suggestion page"
            git push origin HEAD:viewer-archive
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/ctee-keyword-site/viewer/public/
      - name: Deploy keyword website
        id: deployment
        uses: actions/deploy-pages@v4
