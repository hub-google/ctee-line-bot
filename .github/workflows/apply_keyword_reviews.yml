name: Apply CTEE website keyword reviews to GitHub

on:
  schedule:
    # Run off the top of the hour to reduce GitHub scheduling congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - viewer/keyword_gateway/sync_to_github.py
      - .github/workflows/apply_keyword_reviews.yml

permissions:
  contents: write

concurrency:
  group: ctee-website-keyword-review
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify live anonymous inbox and PIN configuration
        run: |
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request("https://ctee-keywords-inbox.ber-at.workers.dev/health",
              headers={"User-Agent":"CTEE-GitHub-Action/1.0"})
          with urllib.request.urlopen(req,timeout=20) as response:
              body=json.load(response)
          assert body.get("ok") is True and body.get("configured") is True, body
          print("CTEE inbox is live, configured, and reachable.")
          PY
      - name: Apply individually approved decisions
        run: python viewer/keyword_gateway/sync_to_github.py
      - name: Commit keyword list and idempotent review log
        shell: bash
        run: |
          set -euo pipefail
          git add keywords.txt viewer/keyword_gateway/processed.json
          if git diff --cached --quiet; then
            echo 'No new reviewed keyword decisions.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "keywords: apply individually reviewed website suggestions"
          git push origin HEAD:master
