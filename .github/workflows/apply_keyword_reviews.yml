name: Apply CTEE website keyword reviews to GitHub

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - viewer/keyword_gateway/sync_to_github.py
      - .github/workflows/apply_keyword_reviews.yml

permissions:
  contents: write

concurrency:
  group: ctee-website-keyword-review
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply individually approved decisions
        run: python viewer/keyword_gateway/sync_to_github.py
      - name: Commit keyword list and idempotent review log
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- keywords.txt viewer/keyword_gateway/processed.json; then
            echo 'No new reviewed keyword decisions.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.txt viewer/keyword_gateway/processed.json
          git commit -m "keywords: apply individually reviewed website suggestions"
          git push origin HEAD:master
