name: One-Time Rename CTEE Originals With Keywords

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ctee_rename_once.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ctee-daily-hq
  cancel-in-progress: false

jobs:
  rename-existing-issue:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate future naming logic and web JavaScript
        run: |
          python -m py_compile viewer/build_preview.py viewer/naming.py viewer/rename_archive.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'viewer')
          from naming import named_original
          assert named_original('2026-11-18',1,'匯率,央行','.jpg')=='20261118_01_匯率、央行.jpg'
          assert named_original('2026-11-18',2,'金控','.jpg')=='20261118_02_金控.jpg'
          print('Naming tests passed')
          PY
          python -c "from pathlib import Path; h=Path('viewer/public/index.html').read_text(); Path('/tmp/ctee-viewer.mjs').write_text(h.split('<script type=\"module\">',1)[1].split('</script>',1)[0])"
          node --check /tmp/ctee-viewer.mjs
      - name: Checkout stored originals (no re-scraping)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin viewer-archive
          git worktree add --detach /tmp/ctee-history origin/viewer-archive
      - name: Verify, rename, and rebuild dated ZIP
        shell: bash
        run: |
          set -euo pipefail
          python viewer/rename_archive.py /tmp/ctee-history/viewer/public
          cp viewer/public/index.html viewer/public/robots.txt /tmp/ctee-history/viewer/public/
          python viewer/update_history.py /tmp/ctee-history/viewer/public
      - name: Save verified archive with history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd /tmp/ctee-history
          git add -A viewer/public
          if git diff --cached --quiet; then
            echo 'All filenames already correct.'
          else
            git commit -m 'archive: use YYYYMMDD_01_關鍵字1、關鍵字2 original image filenames'
            git push origin HEAD:viewer-archive
          fi
      - name: Upload renamed website
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/ctee-history/viewer/public/
      - name: Deploy renamed GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify URLs, hashes, duplicate-free directory and downloadable ZIP
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib,os,re,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          root=Path('/tmp/ctee-history/viewer/public')
          site=os.environ['SITE_URL'].rstrip('/')+'/'
          data=json.loads((root/'data.json').read_text())
          images=data['images']
          assert len(images)==14, 'Unexpected original count'
          assert len({i['sha256'] for i in images})==len(images)
          folder=root/'archive'/data['date']/'images'
          assert len(list(folder.iterdir()))==len(images), 'Duplicate or orphan image files remain'
          expected_date=data['date'].replace('-','')
          with zipfile.ZipFile(root/data['zip']) as z:
            archive_entries=[n for n in z.namelist() if n!='README.txt']
          for n,item in enumerate(images,1):
            name=Path(item['src']).name
            assert re.fullmatch(r'\d{8}_\d{2}_.+\.jpg', name), name
            assert name.startswith(f'{expected_date}_{n:02d}_'), name
            assert name in archive_entries, 'Missing ZIP file '+name
            assert 'thumb' not in item
            assert hashlib.sha256((root/item['src']).read_bytes()).hexdigest()==item['sha256']
          assert len(archive_entries)==len(images)
          with urllib.request.urlopen(site+'data.json') as resp:
            remote=json.load(resp)
          assert [i['src'] for i in remote['images']]==[i['src'] for i in images], 'Site has stale manifest'
          for item in images:
            url=site+urllib.parse.quote(item['src'],safe='/')
            with urllib.request.urlopen(url,timeout=20) as resp:
              assert hashlib.sha256(resp.read()).hexdigest()==item['sha256'],url
          with urllib.request.urlopen(site+urllib.parse.quote(data['zip'],safe='/')) as resp:
            assert resp.read(4).startswith(b'PK')
          print(f'[rename] VERIFIED: {len(images)} dated numbered keyword JPGs, original SHA-256 intact, exactly one dated ZIP, 0 duplicate images')
          PY
