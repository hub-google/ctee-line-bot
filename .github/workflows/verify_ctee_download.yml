name: Verify CTEE downloads in a real browser

on:
  push:
    branches: [master]
    paths:
      - 'viewer/tests/check_download_e2e.py'
      - '.github/workflows/verify_ctee_download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-download:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Verify live pages and actual download events
        run: python viewer/tests/check_download_e2e.py
      - name: Preserve mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctee-browser-download-screenshots
          path: /tmp/ctee-download-check/
          if-no-files-found: ignore
