name: Sync approved keywords to repository

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync_keywords.yml
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctee-keyword-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Download approved keywords
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          url = "https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/ctee-keywords?action=keywords"
          req = urllib.request.Request(url, headers={"User-Agent": "ctee-keywords-sync/1.0"})
          with urllib.request.urlopen(req, timeout=15) as response:
              data = json.load(response)
          terms = data.get("keywords")
          if not isinstance(terms, list) or not 0 < len(terms) <= 500:
              raise SystemExit("Invalid keyword data; refusing to overwrite file")
          if any(not isinstance(term, str) or not term.strip() or "\n" in term for term in terms):
              raise SystemExit("Invalid keyword value")
          target = Path("keywords.txt")
          text = "\n".join(terms) + "\n"
          if target.read_text(encoding="utf-8") != text:
              target.write_text(text, encoding="utf-8")
              print("Updated approved keywords:", len(terms))
          else:
              print("Keyword list unchanged:", len(terms))
          PY
      - name: Commit only when changed
        run: |
          git diff --exit-code -- keywords.txt && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keywords.txt
          git commit -m "keywords: sync administrator-approved changes"
          git push origin HEAD:master
