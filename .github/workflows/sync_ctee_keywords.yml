name: Sync CTEE Approved Keywords Backup

on:
  schedule:
    # Every 15 minutes; GitHub scheduled runs may be delayed.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctee-keyword-backup
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mirror approved keywords from the public Supabase API
        run: python viewer/sync_keywords.py
      - name: Commit changed backup only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- keywords.txt; then
            echo "No change to approved keyword backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- keywords.txt
          git commit -m "sync: mirror approved CTEE keyword settings"
          git push origin HEAD:master
