name: Resend published CTEE LINE Flex

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/resend_ctee_line.yml

permissions:
  contents: read

concurrency:
  group: ctee-line-resend
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimum dependency
        run: python -m pip install requests
      - name: Verify published original clipping and resend LINE Flex
        env:
          SITE_URL: https://hub-google.github.io/ctee-line-bot/
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
        run: python viewer/send_preview.py
