name: Resend published CTEE LINE Flex

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'viewer/line_liff_save_20261119.trigger'

permissions:
  contents: read

concurrency:
  group: ctee-line-resend
  cancel-in-progress: false

jobs:
  resend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ops: one-off 20261119 LINE save UX resend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimum dependency
        run: python -m pip install requests
      - name: Verify updated LINE-native download options published
        run: |
          python - <<'PY'
          import requests
          site='https://hub-google.github.io/ctee-line-bot/'
          response=requests.get(site,headers={'Cache-Control':'no-cache'},params={'savecheck':'20261119-liff-v3'},timeout=20)
          response.raise_for_status()
          html=response.text
          assert 'ctee-download-inline-v3' in html, 'New LINE download UI is not published'
          assert '傳到目前 LINE 聊天室' in html and '已送出「' not in html
          feed=requests.get(site+'data.json',timeout=20).json()
          assert feed.get('date')=='2026-11-19', 'Unexpected published date'
          assert len(feed.get('images',[]))==39, 'Unexpected image count'
          print('Verified live mobile LIFF v3, 2026-11-19, 39 clippings',flush=True)
          PY
      - name: Verify published original clipping and resend LINE Flex
        env:
          SITE_URL: https://hub-google.github.io/ctee-line-bot/
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
        run: python viewer/send_preview.py
