name: Publish CTEE mobile download fix and resend once

on:
  push:
    branches: [master]
    paths:
      - 'viewer/public/index.html'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ctee-download-hotfix
  cancel-in-progress: false

jobs:
  publish-and-resend:
    # This exact one-time commit triggers the requested resend. Future viewer edits do not.
    if: github.event.head_commit.message == 'fix: CTEE inline mobile download 2026-11-19' || github.event.head_commit.message == 'fix: CTEE download file signature check 2026-11-19'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate viewer script
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('viewer/public/index.html').read_text(encoding='utf-8')
          assert 'ctee-download-inline-v2' in html
          assert 'fetch(url' in html and 'URL.createObjectURL' in html
          assert 'openExternalBrowser' not in html
          Path('/tmp/ctee-download.mjs').write_text(html.split('<script type="module">',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ctee-download.mjs
      - name: Copy revised viewer into existing archive without duplicating images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin viewer-archive
          git worktree add --detach /tmp/ctee-gallery-history origin/viewer-archive
          cp viewer/public/index.html /tmp/ctee-gallery-history/viewer/public/index.html
          cd /tmp/ctee-gallery-history
          git add viewer/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: in-page original image and ZIP downloads"
            git push origin HEAD:viewer-archive
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/ctee-gallery-history/viewer/public/
      - name: Deploy updated GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install delivery dependency
        run: python -m pip install requests
      - name: Verify mobile download fix is published
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, requests
          site=os.environ['SITE_URL'].rstrip('/')+'/'
          for attempt in range(45):
              try:
                  r=requests.get(site,params={'hotfix':'20261119'},timeout=15,headers={'Cache-Control':'no-cache'})
                  r.raise_for_status()
                  if 'ctee-download-inline-v2' in r.text:
                      print('Updated download code is live',flush=True)
                      break
              except Exception as e:
                  print(f'Publish check {attempt+1}: {e}',flush=True)
              time.sleep(5)
          else:
              raise SystemExit('No LINE resend: updated viewer is not yet live')
          PY
      - name: Resend current published newspaper Flex to LINE exactly once
        if: github.event.head_commit.message == 'fix: CTEE inline mobile download 2026-11-19'
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python viewer/send_preview.py
