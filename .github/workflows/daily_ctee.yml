name: Daily CTEE High-Quality Clippings to LINE

on:
  schedule:
    # Daily 06:00 Asia/Taipei (GitHub scheduled runs may be delayed)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ctee-daily-hq
  cancel-in-progress: false

jobs:
  daily-hq:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Checkout bot source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate Python and browser module syntax
        run: |
          python -m py_compile viewer/build_preview.py viewer/update_history.py viewer/send_preview.py
          python -c "from pathlib import Path; h=Path('viewer/public/index.html').read_text(); Path('/tmp/ctee-viewer.mjs').write_text(h.split('<script type=\"module\">',1)[1].split('</script>',1)[0])"
          node --check /tmp/ctee-viewer.mjs
      - name: Verify public reader and fast-share LIFF configuration
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          config = Path("viewer/public/liff-config.js").read_text(encoding="utf-8")
          ids = {}
          for key in ("CTEE_LIFF_ID", "CTEE_SHARE_LIFF_ID"):
              match = re.search(r'^window\.' + key + r'\s*=\s*("[^"]+")\s*;\s*$', config, re.M)
              if not match:
                  raise SystemExit("Missing or invalid public " + key)
              ids[key] = json.loads(match.group(1))
              if not re.fullmatch(r"2012346974-[A-Za-z0-9]+", ids[key]):
                  raise SystemExit("Invalid LINE Login channel in " + key)
          if ids["CTEE_LIFF_ID"] == ids["CTEE_SHARE_LIFF_ID"]:
              raise SystemExit("Reader and fast-share LIFF apps must be separate")
          print("Verified reader LIFF and dedicated fast-share LIFF public IDs.")
          PY
      - name: Capture original-quality newspaper images
        env:
          CTEE_USER: ${{ secrets.CTEE_USER }}
          CTEE_PASS: ${{ secrets.CTEE_PASS }}
        run: python viewer/build_preview.py
      - name: Merge new issue into persistent, separate archive branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin viewer-archive
          git worktree add --detach /tmp/ctee-gallery-history origin/viewer-archive
          mkdir -p /tmp/ctee-gallery-history/viewer/public/archive
          issue_date=$(TZ=Asia/Taipei date +%F)
          mkdir -p "/tmp/ctee-gallery-history/viewer/public/archive/$issue_date"
          rsync -a --delete "viewer/public/archive/$issue_date/" "/tmp/ctee-gallery-history/viewer/public/archive/$issue_date/"
          cp viewer/public/index.html viewer/public/share.html viewer/public/keywords.html viewer/public/data.json viewer/public/robots.txt viewer/public/liff-config.js /tmp/ctee-gallery-history/viewer/public/
          python viewer/update_history.py /tmp/ctee-gallery-history/viewer/public
          cd /tmp/ctee-gallery-history
          git add viewer/public
          if git diff --cached --quiet; then
            echo 'Archive unchanged.'
          else
            git commit -m "archive: preserve all newspaper issues through $issue_date"
            git push origin HEAD:viewer-archive
          fi
      - name: Upload GitHub Pages archive
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/ctee-gallery-history/viewer/public/
      - name: Publish independent reader on GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify published original images and send official LINE Flex
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
          EXPECTED_REF: ${{ github.sha }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
        run: python viewer/send_preview.py
