name: Daily CTEE Scan to LINE

on:
  schedule:
    # 每天早上台灣時間 06:00 (UTC 22:00 前一天)
    - cron: '0 22 * * *'
  push:
    branches:
      - master
  workflow_dispatch: # 支援手動觸發測試

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Execute CTEE Downloader
      env:
        CTEE_USER: ${{ secrets.CTEE_USER }}
        CTEE_PASS: ${{ secrets.CTEE_PASS }}
        LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      run: |
        python ctee_downloader_cloud.py

    - name: Upload Diagnostic Logs
      if: always()
      run: |
        git config --global user.name "GitHub Actions-Diag"
        git config --global user.email "actions@github.com"
        git add cloud_log.txt
        git commit -m "Diag: Upload Cloud Execution Logs" || echo "No logs to commit"
        git push origin master

