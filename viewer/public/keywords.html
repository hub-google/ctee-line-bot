<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<meta name="robots" content="noindex,nofollow">
<title>追蹤關鍵字管理｜工商時報每日剪報</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--paper:#fff;--ink:#1b2735;--muted:#6c7785;--border:#e4e9f0;--blue:#2364cb;--lightblue:#e9f1ff;--red:#cf4751;--lightred:#fff1f2;--green:#147c65;--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.52}a{text-decoration:none;color:inherit}
header{background:#fffc;border-bottom:1px solid var(--border);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
.head{max-width:900px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{font-size:15px;font-weight:800;letter-spacing:-.02em}.brand small{display:block;font-weight:450;font-size:11px;color:var(--muted);letter-spacing:0}
.header-actions{display:flex;gap:8px;align-items:center}
.ghost{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-weight:650;color:#405167;font-size:12px}
main{max-width:820px;margin:auto;padding:29px 18px 76px}
h1{font-size:clamp(25px,5vw,33px);letter-spacing:-.045em;line-height:1.25;margin:8px 0}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 22px}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--paper);box-shadow:0 5px 30px #31465d08;padding:25px;margin:18px 0}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
.titlewrap{display:flex;gap:12px;align-items:center}.iconbox{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:13px;font-weight:800;font-size:19px}
.iconbox.blue{background:var(--lightblue);color:var(--blue)}.iconbox.red{background:var(--lightred);color:var(--red)}
h2{font-size:17px;line-height:1.4;margin:0;letter-spacing:-.02em}.help{font-size:12px;color:var(--muted);margin:4px 0 0}
.small-count{font-size:12px;color:var(--muted);white-space:nowrap}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}
input[type=text],input[type=password],textarea{width:100%;min-width:0;border:1px solid #dbe2ea;border-radius:11px;padding:12px 13px;outline:none;background:#fff;color:var(--ink);font-size:14px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:#7aa6e6;box-shadow:0 0 0 3px #2364cb1a}textarea{resize:vertical;min-height:85px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--border);padding:10px 16px;min-height:42px;background:white;font-weight:700;font-size:13px;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98)}.btn.blue{background:var(--blue);border-color:var(--blue);color:white}.btn.red{background:var(--red);border-color:var(--red);color:white}.btn.outlineblue{border-color:#c6d8f8;color:var(--blue);background:#f6f9ff}.btn.outlinered{border-color:#f1ccd0;color:var(--red);background:#fffafb}.btn.gray{color:#546275;background:#f7f9fb}.btn.full{width:100%}
.add-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}.add-row input{flex:1}.remove-row{border:1px solid #f0cdd1;background:#fff9fa;color:#be3e49;border-radius:10px;min-width:42px;height:43px;font-size:18px;display:grid;place-items:center}
.tip{font-size:12px;color:var(--muted);margin:10px 0 0}.section-foot{margin-top:13px}
.keyword-tools{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:10px 0 12px}.keyword-tools input{max-width:310px}.counter{font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}.chip{border:1px solid #e2e7ed;background:#f9fafc;border-radius:999px;padding:8px 13px;font-size:13px;color:#465668;display:inline-flex;gap:7px;align-items:center;min-height:36px;cursor:pointer;user-select:none}
.chip.selected{background:var(--lightred);color:#b33142;border-color:#e89ca3;font-weight:700}.chip .check{width:14px;height:14px;border:1.5px solid #a7b2bf;border-radius:4px;display:grid;place-items:center;font-size:11px;color:white}
.chip.selected .check{background:var(--red);border-color:var(--red)}
.form-bottom{padding:5px 0 0}.form-bottom .panel{margin-top:0}.submit{font-size:15px;padding:14px 18px;min-height:51px}
.summary{border:1px solid #dce8f9;background:#f5f9ff;border-radius:12px;padding:13px;font-size:13px;color:#365577;margin-top:14px}
.alert{border-radius:11px;padding:13px 15px;font-size:13px;line-height:1.6;margin:14px 0}.alert.success{color:#12664f;background:#edf8f3;border:1px solid #cce8dd}.alert.error{color:#a72837;background:#fff2f3;border:1px solid #f4cdd2}.hidden{display:none!important}
.footer{font-size:12px;color:#87909b;text-align:center;margin-top:28px}
.login{max-width:440px;margin:30px auto}.centerhead{text-align:center;padding:7px 0 16px}.lock{display:grid;place-items:center;background:var(--lightblue);color:var(--blue);font-size:24px;width:60px;height:60px;border-radius:19px;margin:0 auto 15px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.stats{display:flex;gap:10px;margin:16px 0}.stat{background:#f6f8fb;border:1px solid #ebeff4;border-radius:14px;padding:15px;flex:1;text-align:center;min-width:0}.stat strong{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}
.review{border:1px solid var(--border);border-radius:14px;padding:17px;margin-top:10px}.review-top{display:flex;justify-content:space-between;gap:10px}.review-top strong{font-size:14px}.review-top time{color:var(--muted);font-size:11px}.tag{font-size:11px;border-radius:100px;padding:4px 9px;background:#f4f6f8;color:#56606c;white-space:nowrap}.tag.approved{background:#eaf7f0;color:#16714f}.tag.rejected{background:#fff1f1;color:#b2444b}
.review-words{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}.word{border-radius:8px;padding:5px 9px;font-size:12px;font-weight:650}.word.add{background:#eaf3ff;color:#265ea7}.word.remove{background:#fff0f2;color:#b9444e}
.reason{font-size:12px;color:#697582;margin-top:8px;overflow-wrap:anywhere}.review-actions{display:flex;gap:8px;margin-top:13px}.review-actions button{flex:1}
.tabs{display:flex;gap:5px;padding:5px;background:#f2f4f7;border-radius:12px;margin-bottom:14px}.tabs button{flex:1;padding:10px 5px;border:none;background:transparent;border-radius:9px;font-size:12px;color:#728092;font-weight:700}.tabs button.active{color:var(--ink);background:#fff;box-shadow:0 2px 7px #21364e13}
#busy{position:fixed;top:78px;right:16px;padding:10px 14px;background:#202f44;color:#fff;border-radius:12px;z-index:50;font-size:12px;box-shadow:0 5px 20px #0002}
@media(max-width:540px){main{padding:22px 12px 64px}.panel{padding:18px 15px;border-radius:15px}.head{padding:12px 14px}.head .ghost{padding:8px 9px}.keyword-tools{align-items:stretch}.keyword-tools input{width:100%;max-width:none}.counter{align-self:center}.titlewrap{gap:10px}.iconbox{width:36px;height:36px}.review{padding:13px}.stats{gap:7px}}
.keyword-review-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border)}.keyword-review-row>.word{margin-right:auto;font-size:14px;padding:7px 11px}.keyword-review-row .btn{min-width:65px}
.keyword-review-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border)}.keyword-review-row>.word{margin-right:auto;font-size:14px;padding:7px 11px}.keyword-review-row .btn{min-width:63px}.request-note{font-size:12px;color:var(--muted);margin:8px 0 12px}.admin-status{font-size:12px;color:var(--muted)}.request-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.notice{margin-top:14px}.review-empty{padding:16px 0;color:var(--muted)}
</style>
</head>
<body>
<header><div class="head"><a class="brand" href="./">工商時報每日剪報<small>CTEE · News Tracker</small></a><div class="header-actions"><a href="./" class="ghost">閱讀剪報</a></div></div></header>
<main>
<h1>追蹤關鍵字</h1>
<p class="subtitle">目前追蹤的關鍵字以 GitHub 的 keywords.txt 為準。</p>
<section class="panel">
<div class="topline">
<div class="titlewrap"><span class="iconbox blue">✓</span><div><h2>目前追蹤中的關鍵字</h2><p class="help">直接從 GitHub 讀取清單</p></div></div>
<span class="counter" id="allCount">載入中…</span>
</div>
<div class="keyword-tools"><input type="search" id="wordSearch" name="ctee_keyword_search" autocomplete="off" autocapitalize="none" spellcheck="false" readonly placeholder="搜尋追蹤中的關鍵字…" aria-label="搜尋關鍵字"></div>
<div class="chips" id="keywordChips" aria-live="polite"></div>
</section>
<p class="subtitle">線上關鍵字申請及審核目前暫停，已移除原收件服務。</p>
<p class="footer">工商時報每日剪報 · GitHub 關鍵字清單</p>
</main>
<script type="module">
const REPO="hub-google/ctee-line-bot";
const words=[];
const q=s=>document.querySelector(s);
const filter=q("#wordSearch");
const list=q("#keywordChips");
let activated=false;
function render(){
  list.replaceChildren();
  const query=filter.value.normalize("NFKC").trim();
  const visible=words.filter(x=>x.includes(query));
  for(const word of visible){
    const chip=document.createElement("span");
    chip.className="chip";
    chip.textContent=word;
    list.appendChild(chip);
  }
  if(!visible.length){
    const empty=document.createElement("span");
    empty.className="tip";
    empty.textContent="沒有相符關鍵字";
    list.appendChild(empty);
  }
  q("#allCount").textContent="共 "+words.length+" 個";
}
function activate(){
  if(activated)return;
  activated=true;
  filter.readOnly=false;
  filter.value="";
  render();
}
filter.value="";
filter.addEventListener("pointerdown",activate);
filter.addEventListener("focus",activate);
filter.addEventListener("keydown",activate);
filter.addEventListener("input",render);
window.addEventListener("pageshow",()=>{if(!activated){filter.value="";render()}});
(async()=>{
  try{
    const r=await fetch("https://raw.githubusercontent.com/"+REPO+"/master/keywords.txt?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw Error("GitHub HTTP "+r.status);
    const items=(await r.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    if(!items.length)throw Error("GitHub 關鍵字清單為空");
    words.splice(0,words.length,...items);
    render();
  }catch(err){
    q("#allCount").textContent="載入失敗";
    list.replaceChildren();
    const msg=document.createElement("span");
    msg.className="tip";
    msg.textContent="目前無法讀取 GitHub 關鍵字："+err.message;
    list.appendChild(msg);
  }
})();
</script>
</body></html>
