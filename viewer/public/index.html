<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>工商時報｜每日剪報閱讀器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
  <style>
    :root {color-scheme: light; --bg:#f6f7f8;--fg:#20272f;--muted:#687482;--line:#e2e7ea;--accent:#176e5c;--white:#fff;}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
    button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
    .head{max-width:960px;min-height:66px;padding:12px 20px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:17px;font-weight:750;letter-spacing:.01em}.brand small{display:block;font-size:11px;letter-spacing:.03em;color:var(--muted);font-weight:450}
    main{max-width:960px;margin:auto;padding:25px 18px 80px}
    h1{font-size:clamp(27px,5vw,37px);letter-spacing:-.04em;line-height:1.3;margin:12px 0 5px}
    .intro{font-size:14px;color:var(--muted);margin-bottom:20px}.summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{background:#e6eee9;color:#176e5c;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:650}
    .tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 20px}
    .history{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 11px;white-space:nowrap}.history span{font-size:12px;color:var(--muted)}.history select{appearance:auto;background:transparent;border:0;max-width:190px;min-width:155px;font-size:13px;color:var(--fg);outline:none}
    .tabs{background:#e7ebee;border-radius:12px;padding:4px;display:flex;gap:4px}
    .tabs button{border:0;border-radius:9px;background:transparent;padding:9px 15px;color:#4e5964;font-weight:650;font-size:13px;cursor:pointer}
    .tabs button.active{background:#fff;color:#161e25;box-shadow:0 1px 5px #0012}
    .actions{display:flex;flex-wrap:wrap;gap:7px}
    .btn{padding:10px 13px;background:#fff;color:#27313a;border:1px solid #d9e1e4;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer}
    .btn.primary{background:#146e5a;color:#fff;border-color:#146e5a}
    .hint{color:var(--muted);font-size:12px;margin:0 0 18px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
    .gallery.flow{display:flex;flex-direction:column;max-width:820px;margin:auto;gap:24px}
    .item{background:#fff;border-radius:15px;border:1px solid var(--line);box-shadow:0 3px 20px #182b3808;overflow:hidden;min-width:0}
    .image-btn{display:block;width:100%;border:0;background:#fff;padding:0;cursor:zoom-in;text-align:left}
    .image-btn img{width:100%;height:220px;object-fit:contain;display:block;background:#f5f5f3}
    .flow .image-btn img{height:auto;max-height:none;object-fit:contain}
    .meta{padding:11px 13px;display:flex;gap:8px;justify-content:space-between;align-items:center}
    .meta .title{font-size:12px;overflow-wrap:anywhere;color:#38444b}
    .meta .number{font-size:12px;font-weight:750;color:var(--accent)}
    .download{font-size:12px;color:var(--accent);font-weight:650;white-space:nowrap;padding:5px 0 5px 8px;cursor:pointer}
    .download[aria-busy="true"],.btn[aria-busy="true"]{opacity:.65;cursor:progress;pointer-events:none}
    .download-status{font-size:12px;color:#176e5c;margin:-8px 0 18px;overflow-wrap:anywhere}
    .download-status.error{color:#b42318}
    .download-dialog{width:min(calc(100vw - 28px),430px);max-height:min(85vh,700px);border:0;border-radius:18px;padding:22px;background:#fff;color:var(--fg);box-shadow:0 20px 90px #0003}
    .download-dialog::backdrop{background:#10182099}
    .download-dialog h2{font-size:19px;line-height:1.35;margin:0 0 9px}
    .download-dialog p{font-size:13px;color:#52616d;line-height:1.65;margin:0 0 12px;overflow-wrap:anywhere}
    .download-choices{display:grid;gap:10px}
    .download-choices button{border:1px solid #cbd7d7;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font-weight:650;color:#176e5c;cursor:pointer;line-height:1.35}
    .download-choices button.primary{background:#176e5c;border-color:#176e5c;color:white}
    .download-choices button:disabled{opacity:.6}
    .download-dialog .close-download{width:100%;margin-top:14px;padding:10px;border:0;background:#f1f3f4;border-radius:10px;font-size:13px;font-weight:650;cursor:pointer}
    .status{padding:38px 25px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted)}
    .share-feedback{display:block;width:100%;font-size:12px;color:#b42318;margin-top:6px}.share-feedback[hidden]{display:none}.footer{text-align:center;font-size:12px;color:var(--muted);padding-top:25px}
    .pswp__button--download{display:flex!important;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:650;min-width:70px}
    @media(min-width:700px){.gallery:not(.flow) .image-btn img{height:270px}}
    @media(max-width:430px){main{padding:18px 12px 64px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.image-btn img{height:195px}.meta{padding:9px;gap:4px}.head{padding:11px 14px}.brand{font-size:15px}}
  </style>
</head>
<body>
<header><div class="head"><div class="brand">工商時報 <small>每日剪報｜原圖閱讀與歷史典藏</small></div></div></header>
<main>
  <div class="summary"><span class="pill">原始畫質</span><span class="pill" id="countBadge">正在載入</span></div>
  <h1 id="headline">今日工商時報剪報</h1>
  <div class="intro" id="subtitle">載入當日新聞圖片中…</div>
  <div class="tools">
    <label class="history"><span>選擇日期</span><select id="daySelect" aria-label="選擇歷史剪報日期"><option>載入中…</option></select></label>
    <div class="tabs" role="group" aria-label="閱讀模式"><button id="flowBtn" type="button" class="active" aria-pressed="true">連續閱讀</button><button id="gridBtn" type="button" aria-pressed="false">縮圖總覽</button></div>
    <div class="actions"><button id="openBtn" type="button" class="btn primary">全螢幕放大</button><button id="zipBtn" type="button" class="btn" disabled>下載全部剪報</button><button type="button" id="showShareBtn" class="btn">分享至 LINE</button></div><span id="shareFeedback" class="share-feedback" aria-live="polite" role="status" hidden></span>
  </div>
  <p id="downloadStatus" class="download-status" role="status" aria-live="polite" hidden></p>
  <dialog id="downloadDialog" class="download-dialog" aria-labelledby="downloadHeading">
    <h2 id="downloadHeading">儲存剪報</h2>
    <p id="downloadDescription"></p>
    <div id="downloadChoices" class="download-choices"></div>
    <p id="downloadDialogStatus" role="status" aria-live="polite" style="margin-top:12px" hidden></p>
    <button type="button" id="closeDownload" class="close-download">返回閱讀</button>
  </dialog>
  <p class="hint">只保存一份來源原圖。連續閱讀與縮圖總覽都使用同一張原圖（以瀏覽器縮放顯示），可雙指放大、拖曳細看、左右換篇。</p>
  <div id="gallery" class="gallery flow"><div class="status">正在取得剪報，請稍候…</div></div>
  <div class="footer">獨立剪報閱讀器，不影響原本 LINE 每日推播與 Rentry。<br>新聞影像的可辨識細節仍受原始來源解析度限制。</div>
</main>
<script src="liff-config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
const gallery=document.querySelector('#gallery');
const flowBtn=document.querySelector('#flowBtn'),gridBtn=document.querySelector('#gridBtn');
const dateSelect=document.querySelector('#daySelect');
const query=new URLSearchParams(location.search);
const selected=query.get('date')||'';
const validDate=/^\d{4}-\d{2}-\d{2}$/.test(selected);
let images=[], lightbox=null, mode='flow', displayedDate='';
const liffId=String(window.CTEE_LIFF_ID||'').trim();
const shareLiffId=String(window.CTEE_SHARE_LIFF_ID||'').trim();
const zipButton=document.querySelector('#zipBtn');
const downloadStatus=document.querySelector('#downloadStatus');
const downloading=new Set(); // ctee-download-inline-v3
const downloadDialog=document.querySelector('#downloadDialog');
const downloadHeading=document.querySelector('#downloadHeading');
const downloadDescription=document.querySelector('#downloadDescription');
const downloadChoices=document.querySelector('#downloadChoices');
const dialogStatus=document.querySelector('#downloadDialogStatus');
document.querySelector('#closeDownload').addEventListener('click',()=>downloadDialog.close());
function inLineBrowser(){
  try{if(window.liff?.isInClient?.())return true}catch(e){}
  return /\bLine\//i.test(navigator.userAgent);
}
let zipDownloadUrl='';
const shareButton=document.querySelector('#showShareBtn');
const shareFeedback=document.querySelector('#shareFeedback');
const autoShareRequested=query.get('share')==='1';
const readerUrl=()=>location.origin+location.pathname+'?date='+encodeURIComponent(displayedDate);
const shareUrl=()=>liffId?'https://liff.line.me/'+encodeURIComponent(liffId)+'?date='+encodeURIComponent(displayedDate):readerUrl();
const flexShareLaunchUrl=()=>shareLiffId?'https://liff.line.me/'+encodeURIComponent(shareLiffId)+'?date='+encodeURIComponent(displayedDate)+'&count='+images.length:shareUrl()+'&share=1';
let liffInitPromise=null;
function ensureLiff(){
  if(!liffId||!window.liff)return Promise.reject(new Error('LIFF not configured'));
  if(!liffInitPromise)liffInitPromise=window.liff.init({liffId}).catch(err=>{liffInitPromise=null;throw err;});
  return liffInitPromise;
}
function buildShareCard(){
  const dateText=displayedDate.replaceAll('-','/');
  const pageUrl=shareUrl();
  return {type:'flex',altText:'工商時報｜'+dateText+' 每日剪報，共 '+images.length+' 則，點擊閱讀原圖',
    contents:{type:'bubble',size:'mega',
      header:{type:'box',layout:'vertical',backgroundColor:'#173C32',paddingAll:'20px',contents:[
        {type:'text',text:'工商時報',weight:'bold',size:'xl',color:'#FFFFFF'},
        {type:'text',text:'每日新聞剪報  |  原圖典藏',size:'xs',color:'#C3DFD5',margin:'xs'}]},
      body:{type:'box',layout:'vertical',spacing:'md',contents:[
        {type:'text',text:dateText+'  精選報導',weight:'bold',size:'md',color:'#1D3331'},
        {type:'text',text:'依照追蹤關鍵字，收錄 '+images.length+' 則相關新聞。',size:'sm',wrap:true,color:'#50615D'},
        {type:'separator',margin:'md',color:'#E7EDEB'},
        {type:'text',text:'原圖畫質・雙指縮放・歷史查閱・整批下載',size:'xs',wrap:true,color:'#65736D'}]},
      footer:{type:'box',layout:'vertical',spacing:'sm',contents:[
        {type:'button',style:'primary',height:'sm',color:'#176B57',action:{type:'uri',label:'開啟每日剪報',uri:pageUrl}},
        {type:'button',style:'primary',height:'sm',color:'#286BA6',action:{type:'uri',label:'分享新聞給好友',uri:flexShareLaunchUrl()}},
        {type:'button',style:'primary',height:'sm',color:'#7156A4',action:{type:'uri',label:'調整追蹤關鍵字',uri:location.origin+location.pathname.replace(/[^/]*$/,'')+'keywords.html'}}]}
    }};
}
async function shareToLine(auto=false){
  if(!displayedDate||!images.length){if(!auto)window.alert('剪報尚未載入完成，請稍候重試。');return;}
  shareFeedback.hidden=true;
  shareButton.disabled=true;
  try{
    if(!liffId||!window.liff)throw new Error('LINE LIFF 尚未就緒，請使用 LINE App 開啟剪報後分享。');
    await ensureLiff();
    if(!window.liff.isLoggedIn()){
      if(!window.liff.isInClient()) {
        window.liff.login({redirectUri:location.href});
        return;
      }
      throw new Error('LINE 登入尚未完成，請重新開啟 LIFF。');
    }
    if(!window.liff.isApiAvailable('shareTargetPicker')){
      throw new Error('目前的 LINE 環境不支援 Flex 圖文分享，請從手機 LINE App 開啟這份剪報。');
    }
    if(autoShareRequested && auto){
      const clean=new URL(location.href);
      clean.searchParams.delete('share');
      history.replaceState(null,'',clean.toString());
    }
    const result=await window.liff.shareTargetPicker([buildShareCard()],{isMultiple:true});
    if(result?.status==='success') {
      shareFeedback.textContent='Flex 圖文剪報已分享成功。';
      shareFeedback.style.color='#176e5c';
      shareFeedback.hidden=false;
    }
  }catch(err){
    // Never silently downgrade a user-requested Flex card to a text link.
    // Keep the original one-tap button available for a retry in LINE.
    shareFeedback.style.color='#b42318';
    shareFeedback.textContent='圖文分享未完成：'+(err?.message||String(err));
    shareFeedback.hidden=false;
  }finally{shareButton.disabled=false;}
}
// Keep downloads in this LIFF page. Never use LINE openWindow, _blank or navigation.
function reportDownload(message,error=false){
  downloadStatus.hidden=false;
  downloadStatus.classList.toggle('error',error);
  downloadStatus.textContent=message;
}
function originalFilename(item){
  const name=new URL(item.src,location.href).pathname.split('/').pop()||'';
  try{return decodeURIComponent(name)||'工商時報原圖.jpg'}catch{return name||'工商時報原圖.jpg'}
}
function realDownloadUrl(url){
  const target=new URL(url,location.href);
  if(target.origin!==location.origin || !target.pathname.startsWith('/ctee-line-bot/archive/'))throw Error('檔案不屬於本站的歷史歸檔');
  return target;
}
function addDownloadChoice(label,action,primary=false){
  const button=document.createElement('button');
  button.type='button';
  button.className=primary?'primary':'';
  button.textContent=label;
  button.addEventListener('click',()=>action(button));
  downloadChoices.append(button);
}
function openSystemDownload(url){
  // This route requires an explicit selection. Never switch browsers automatically.
  const target=realDownloadUrl(url);
  if(window.liff && typeof window.liff.openWindow==='function'){
    try{
      window.liff.openWindow({url:target.href,external:true});
      return;
    }catch(e){console.warn('Unable to open system download through LIFF',e)}
  }
  const external=new URL(target.href);
  external.searchParams.set('openExternalBrowser','1');
  location.href=external.href;
}
async function sendPhotoToChat(item,control){
  control.disabled=true;
  dialogStatus.hidden=false;
  dialogStatus.textContent='正在透過 LINE 傳送圖片…';
  try{
    await ensureLiff();
    if(!window.liff.isInClient() || typeof window.liff.sendMessages!=='function')
      throw new Error('這個連結不是從 LINE LIFF 聊天室開啟，無法傳回目前聊天室');
    const url=realDownloadUrl(item.src).href;
    await window.liff.sendMessages([{type:'image',originalContentUrl:url,previewImageUrl:url}]);
    downloadDialog.close();
    reportDownload('已將圖片傳送到目前 LINE 聊天室（不是已存進手機）。返回聊天後點開圖片，再按「下載」保存。LINE 可能壓縮圖片；若要完整原始 JPG，請使用系統下載。');
  }catch(error){
    dialogStatus.textContent='LINE 圖片傳送失敗：'+(error?.message||String(error));
  }finally{
    control.disabled=false;
  }
}
function showLineDownloadOptions(kind,item){
  downloadChoices.replaceChildren();
  dialogStatus.hidden=true;
  const isImage=kind==='image';
  const fileName=isImage?originalFilename(item):'工商時報_'+displayedDate.replaceAll('-','')+'.zip';
  const source=isImage?item.src:zipDownloadUrl;
  downloadHeading.textContent=isImage?'儲存原圖':'下載全部剪報';
  if(isImage){
    downloadDescription.textContent='LINE 內建瀏覽器不支援直接下載。可以將圖片傳到目前 LINE 聊天室，再從 LINE 圖片檢視器儲存；若來源是群組，此動作會讓群組成員看到圖片。LINE 轉傳圖片可能改變原圖畫質。';
    if(window.liff && typeof window.liff.sendMessages==='function'){
      addDownloadChoice('傳到目前 LINE 聊天室，再從 LINE 儲存',button=>{void sendPhotoToChat(item,button)},true);
    }
  }else{
    downloadDescription.textContent='此份剪報共 '+images.length+' 張。LINE LIFF 不支援把 ZIP 靜默寫進手機，所以在 LINE 內不能保證直接下載。完整原始畫質 ZIP 必須交給支援下載的系統瀏覽器，點一下即可啟動；閱讀頁仍保留在 LINE。';
  }
  addDownloadChoice('下載原始'+(isImage?' JPG':' ZIP')+'（使用手機瀏覽器）',()=>{
    try{openSystemDownload(source)}catch(e){dialogStatus.hidden=false;dialogStatus.textContent=e.message}
  },!isImage);
  addDownloadChoice('複製'+(isImage?'原圖':'ZIP')+'下載網址',async()=>{
    try{
      const url=realDownloadUrl(source).href;
      if(!navigator.clipboard?.writeText)throw Error('此 LINE 版本不支援複製');
      await navigator.clipboard.writeText(url);
      dialogStatus.hidden=false;
      dialogStatus.textContent='已複製連結。可貼到支援下載的瀏覽器。';
    }catch(e){dialogStatus.hidden=false;dialogStatus.textContent='複製失敗：'+e.message}
  });
  if(!downloadDialog.open)downloadDialog.showModal();
}
async function saveFileInPage(url,filename,control){
  if(!url){reportDownload('下載資料尚未載入，請稍候重試。',true);return}
  let target;
  try{target=realDownloadUrl(url)}catch(e){reportDownload(e.message,true);return}
  if(downloading.has(target.href))return;
  downloading.add(target.href);
  const previousLabel=control.textContent;
  const previouslyDisabled=control.disabled===true;
  control.setAttribute('aria-busy','true');
  if('disabled' in control)control.disabled=true;
  control.textContent='準備下載…';
  reportDownload('正在向本站取得 '+filename+'…');
  try{
    const response=await fetch(target.href,{credentials:'same-origin'});
    if(!response.ok)throw new Error('檔案伺服器回應 HTTP '+response.status);
    const blob=await response.blob();
    if(!blob.size)throw new Error('檔案內容為空');
    if(filename.toLowerCase().endsWith('.zip')){
      const bytes=new Uint8Array(await blob.slice(0,4).arrayBuffer());
      if(bytes[0]!==80||bytes[1]!==75)throw new Error('伺服器未回傳有效 ZIP');
    }else if(filename.toLowerCase().endsWith('.jpg')||filename.toLowerCase().endsWith('.jpeg')){
      const bytes=new Uint8Array(await blob.slice(0,3).arrayBuffer());
      if(bytes[0]!==255||bytes[1]!==216||bytes[2]!==255)throw new Error('伺服器未回傳有效 JPG');
    }
    const blobUrl=URL.createObjectURL(blob);
    try{
      const a=document.createElement('a');
      a.href=blobUrl;
      a.download=filename;
      a.style.display='none';
      document.body.append(a);
      a.click();
      a.remove();
    }finally{setTimeout(()=>URL.revokeObjectURL(blobUrl),120000)}
    reportDownload('已交給瀏覽器下載「'+filename+'」；請在裝置下載項目確認，網頁無法確認是否成功存檔。');
  }catch(err){
    reportDownload('下載失敗：'+(err?.message||String(err))+'。請重試。',true);
  }finally{
    downloading.delete(target.href);
    control.removeAttribute('aria-busy');
    if('disabled' in control)control.disabled=previouslyDisabled;
    control.textContent=previousLabel;
  }
}
function downloadSingleClipping(item,control){
  if(inLineBrowser()){showLineDownloadOptions('image',item);return}
  void saveFileInPage(item.src,originalFilename(item),control);
}
function downloadAllClippings(){
  if(!zipDownloadUrl){reportDownload('剪報尚未載入完成，請稍候重試。',true);return}
  if(inLineBrowser()){showLineDownloadOptions('zip');return}
  void saveFileInPage(zipDownloadUrl,'工商時報_'+displayedDate.replaceAll('-','')+'.zip',zipButton);
}
zipButton.addEventListener('click',downloadAllClippings);
shareButton.addEventListener('click',()=>shareToLine(false));
if(liffId)ensureLiff().catch(()=>{});
function setMode(newMode){
  mode=newMode==='grid'?'grid':'flow';
  gallery.classList.toggle('flow',mode==='flow');
  flowBtn.classList.toggle('active',mode==='flow');gridBtn.classList.toggle('active',mode==='grid');
  flowBtn.setAttribute('aria-pressed',String(mode==='flow'));gridBtn.setAttribute('aria-pressed',String(mode==='grid'));
  for(const img of gallery.querySelectorAll('img[data-full]')){
    const next=img.dataset.full;
    if(img.getAttribute('src')!==next)img.src=next;
  }
  try{localStorage.setItem('ctee-viewer-mode',mode)}catch(e){}
}
flowBtn.addEventListener('click',()=>setMode('flow'));
gridBtn.addEventListener('click',()=>setMode('grid'));
dateSelect.addEventListener('change',()=>{
  const next=new URL(location.href);
  if(dateSelect.value)next.searchParams.set('date',dateSelect.value);
  else next.searchParams.delete('date');
  location.assign(next.toString());
});
function el(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}
function openGallery(i){if(lightbox){lightbox.loadAndOpen(i);return}window.open(images[i].src,'_blank','noopener')}
function render(){
  gallery.replaceChildren();
  images.forEach((item,i)=>{
    const card=el('article','item');
    const btn=el('button','image-btn');btn.type='button';btn.setAttribute('aria-label','放大第 '+(i+1)+' 張剪報');
    const img=el('img');img.className='clipping-image';
    img.dataset.full=item.src;
    img.src=item.src;
    img.alt='第 '+(i+1)+' 張剪報：'+(item.keyword||'');img.loading=i<2?'eager':'lazy';img.decoding='async';
    btn.append(img);btn.addEventListener('click',()=>openGallery(i));
    const meta=el('div','meta');
    const info=el('div','title');
    info.append(el('span','number',String(i+1).padStart(2,'0')+' / '+images.length+' · '));
    info.append(document.createTextNode(item.keyword||'剪報'));
    const resolution=el('div','','原圖 '+item.width+'×'+item.height);resolution.style.color='#7a858d';resolution.style.fontSize='11px';
    info.append(resolution);
    const link=el('a','download','下載原圖');link.href=item.src;
    link.download=originalFilename(item);
    link.setAttribute('aria-label','下載第 '+(i+1)+' 張來源原圖');
    link.addEventListener('click',event=>{
      event.preventDefault();
      downloadSingleClipping(item,link);
    });
    meta.append(info,link);card.append(btn,meta);gallery.append(card);
  });
}
try{
  try{mode=localStorage.getItem('ctee-viewer-mode')||'flow'}catch(e){}
  gallery.classList.toggle('flow',mode!=='grid');
  flowBtn.classList.toggle('active',mode!=='grid');gridBtn.classList.toggle('active',mode==='grid');
  const dataPath=validDate?'archive/'+selected+'/data.json':'data.json';
  const r=await fetch(dataPath+'?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('剪報資料 HTTP '+r.status);
  const data=await r.json();
  if(!Array.isArray(data.images)||data.images.length===0)throw Error('該日期尚無有效剪報');
  images=data.images;displayedDate=data.date;
  document.querySelector('#headline').textContent=(data.date_label||data.date)+' 工商時報剪報';
  document.querySelector('#subtitle').textContent='收錄 '+images.length+' 張 · 原始畫質 · 歷史日期可切換';
  document.querySelector('#countBadge').textContent=images.length+' 張原圖';
  const zip=data.zip||'archive/'+displayedDate+'/工商時報_'+displayedDate.replaceAll('-','')+'.zip';
  zipDownloadUrl=new URL(zip,location.href).href;
  zipButton.disabled=false;
  render();setMode(mode);
  if(autoShareRequested){
    // LINE's Flex button opens this LIFF in share mode; authentication may
    // redirect first, so the flag is removed only after login succeeds.
    void shareToLine(true);
  }
  try{
    const hr=await fetch('history.json?ts='+Date.now(),{cache:'no-store'});
    if(!hr.ok)throw Error('history index not ready');
    const history=await hr.json();
    dateSelect.replaceChildren();
    const days=Array.isArray(history.dates)?history.dates:[];
    for(const day of days){
      const opt=document.createElement('option');opt.value=day.date;
      opt.textContent=day.date.replaceAll('-','/')+' · '+day.count+' 張';
      dateSelect.append(opt);
    }
    if(!days.some(day=>day.date===displayedDate)){
      const opt=document.createElement('option');opt.value=displayedDate;opt.textContent=data.date_label;
      dateSelect.prepend(opt);
    }
    dateSelect.value=displayedDate;
  }catch(e){
    dateSelect.replaceChildren();
    const opt=document.createElement('option');opt.value=displayedDate;opt.textContent=data.date_label||displayedDate;dateSelect.append(opt);
  }
  try{
    const {default:PhotoSwipeLightbox}=await import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js');
    lightbox=new PhotoSwipeLightbox({
      dataSource:images.map(item=>({src:item.src,width:item.width,height:item.height,alt:item.keyword||'剪報原圖'})),
      pswpModule:()=>import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js'),
      bgOpacity:.95,pinchToClose:false
    });
    lightbox.on('uiRegister',()=>{
      lightbox.pswp.ui.registerElement({name:'download-button',order:8,isButton:true,tagName:'a',html:'下載原圖',onInit:(button,pswp)=>{
        const update=()=>{const i=pswp.currIndex;button.href=images[i].src;button.download=originalFilename(images[i]);button.title='下載來源原圖'};
        button.addEventListener('click',event=>{
          event.preventDefault();
          const item=images[pswp.currIndex];
          if(item)downloadSingleClipping(item,button);
        });
        pswp.on('change',update);update();
      }});
    });
    lightbox.init();
  }catch(err){console.warn('PhotoSwipe 無法載入，改以新分頁開原圖',err)}
  document.querySelector('#openBtn').addEventListener('click',()=>openGallery(0));
}catch(err){
  gallery.replaceChildren(el('div','status','暫時無法載入剪報：'+err.message));
  document.querySelector('#countBadge').textContent='無資料';
  document.querySelector('#openBtn').disabled=true;
  zipButton.disabled=true;
}
</script>
</body></html>
