<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>工商時報｜每日剪報閱讀器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
  <style>
    :root {color-scheme: light; --bg:#f6f7f8;--fg:#20272f;--muted:#687482;--line:#e2e7ea;--accent:#176e5c;--white:#fff;}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
    button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}
    header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
    .head{max-width:960px;min-height:66px;padding:12px 20px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:17px;font-weight:750;letter-spacing:.01em}.brand small{display:block;font-size:11px;letter-spacing:.03em;color:var(--muted);font-weight:450}
    .headlink{background:#e8f2ef;color:#176e5c;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:650;white-space:nowrap}
    main{max-width:960px;margin:auto;padding:25px 18px 80px}
    h1{font-size:clamp(27px,5vw,37px);letter-spacing:-.04em;line-height:1.3;margin:12px 0 5px}
    .intro{font-size:14px;color:var(--muted);margin-bottom:20px}.summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{background:#e6eee9;color:#176e5c;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:650}
    .tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 20px}
    .history{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 11px;white-space:nowrap}.history span{font-size:12px;color:var(--muted)}.history select{appearance:auto;background:transparent;border:0;max-width:190px;min-width:155px;font-size:13px;color:var(--fg);outline:none}
    .tabs{background:#e7ebee;border-radius:12px;padding:4px;display:flex;gap:4px}
    .tabs button{border:0;border-radius:9px;background:transparent;padding:9px 15px;color:#4e5964;font-weight:650;font-size:13px;cursor:pointer}
    .tabs button.active{background:#fff;color:#161e25;box-shadow:0 1px 5px #0012}
    .actions{display:flex;flex-wrap:wrap;gap:7px}
    .btn{padding:10px 13px;background:#fff;color:#27313a;border:1px solid #d9e1e4;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer}
    .btn.primary{background:#146e5a;color:#fff;border-color:#146e5a}
    .hint{color:var(--muted);font-size:12px;margin:0 0 18px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
    .gallery.flow{display:flex;flex-direction:column;max-width:820px;margin:auto;gap:24px}
    .item{background:#fff;border-radius:15px;border:1px solid var(--line);box-shadow:0 3px 20px #182b3808;overflow:hidden;min-width:0}
    .image-btn{display:block;width:100%;border:0;background:#fff;padding:0;cursor:zoom-in;text-align:left}
    .image-btn img{width:100%;height:220px;object-fit:contain;display:block;background:#f5f5f3}
    .flow .image-btn img{height:auto;max-height:none;object-fit:contain}
    .meta{padding:11px 13px;display:flex;gap:8px;justify-content:space-between;align-items:center}
    .meta .title{font-size:12px;overflow-wrap:anywhere;color:#38444b}
    .meta .number{font-size:12px;font-weight:750;color:var(--accent)}
    .download{font-size:12px;color:var(--accent);font-weight:650;white-space:nowrap;padding:5px 0 5px 8px}
    .status{padding:38px 25px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted)}
    .share-panel{margin:0 0 20px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;gap:10px}.share-panel[hidden]{display:none}.share-status{font-size:12px;color:var(--muted)}.footer{text-align:center;font-size:12px;color:var(--muted);padding-top:25px}
    .pswp__button--download{display:flex!important;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:650;min-width:70px}
    @media(min-width:700px){.gallery:not(.flow) .image-btn img{height:270px}}
    @media(max-width:430px){main{padding:18px 12px 64px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.image-btn img{height:195px}.meta{padding:9px;gap:4px}.head{padding:11px 14px}.brand{font-size:15px}.headlink{font-size:12px;padding:8px 9px}}
  </style>
</head>
<body>
<header><div class="head"><div class="brand">工商時報 <small>每日剪報｜原圖閱讀與歷史典藏</small></div><a id="topDownload" class="headlink" href="latest.zip" download>下載全部剪報</a></div></header>
<main>
  <div class="summary"><span class="pill">原始畫質</span><span class="pill" id="countBadge">正在載入</span></div>
  <h1 id="headline">今日工商時報剪報</h1>
  <div class="intro" id="subtitle">載入當日新聞圖片中…</div>
  <div class="tools">
    <label class="history"><span>選擇日期</span><select id="daySelect" aria-label="選擇歷史剪報日期"><option>載入中…</option></select></label>
    <div class="tabs" role="group" aria-label="閱讀模式"><button id="flowBtn" type="button" class="active" aria-pressed="true">連續閱讀</button><button id="gridBtn" type="button" aria-pressed="false">縮圖總覽</button></div>
    <div class="actions"><button id="openBtn" type="button" class="btn primary">全螢幕放大</button><a id="zipBtn" class="btn" href="latest.zip" download>下載全部 ZIP</a><button type="button" id="showShareBtn" class="btn">分享給 LINE 好友</button></div>
  </div>
  <section class="share-panel" id="sharePanel" hidden aria-label="分享新聞剪報"><strong>分享當日新聞剪報</strong><span class="share-status">選擇好友或群組，分享圖文剪報卡片。</span><button type="button" id="shareBtn" class="btn primary">選擇 LINE 好友／群組</button><span id="shareStatus" class="share-status" role="status" aria-live="polite"></span></section>
  <p class="hint">只保存一份來源原圖。連續閱讀與縮圖總覽都使用同一張原圖（以瀏覽器縮放顯示），可雙指放大、拖曳細看、左右換篇。</p>
  <div id="gallery" class="gallery flow"><div class="status">正在取得剪報，請稍候…</div></div>
  <div class="footer">獨立剪報閱讀器，不影響原本 LINE 每日推播與 Rentry。<br>新聞影像的可辨識細節仍受原始來源解析度限制。</div>
</main>
<script src="liff-config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
const gallery=document.querySelector('#gallery');
const flowBtn=document.querySelector('#flowBtn'),gridBtn=document.querySelector('#gridBtn');
const dateSelect=document.querySelector('#daySelect');
const query=new URLSearchParams(location.search);
const selected=query.get('date')||'';
const validDate=/^\d{4}-\d{2}-\d{2}$/.test(selected);
let images=[], lightbox=null, mode='flow', displayedDate='';
const liffId=String(window.CTEE_LIFF_ID||'').trim();
const sharePanel=document.querySelector('#sharePanel');
const shareStatus=document.querySelector('#shareStatus');
const shareButton=document.querySelector('#shareBtn');
const queryShare=query.get('share')==='1';
const shareUrl=()=> liffId?'https://liff.line.me/'+encodeURIComponent(liffId)+'?date='+encodeURIComponent(displayedDate):location.origin+location.pathname+'?date='+encodeURIComponent(displayedDate);
let liffInitPromise=null;
function ensureLiff(){
  if(!liffId) return Promise.reject(new Error('LIFF ID 尚未設定，請先在 GitHub Secrets 設定 LIFF_ID，並在 LINE Developers 啟用分享對象選擇器。'));
  if(!window.liff) return Promise.reject(new Error('LINE LIFF SDK 無法載入，請檢查網路後重試。'));
  if(!liffInitPromise) liffInitPromise=window.liff.init({liffId}).catch(err=>{liffInitPromise=null;throw err;});
  return liffInitPromise;
}
function buildShareCard(){
  const dateText=displayedDate.replaceAll('-','/');
  const pageUrl=shareUrl();
  return {type:'flex',altText:'工商時報｜'+dateText+' 每日剪報，共 '+images.length+' 則，點擊閱讀原圖',
    contents:{type:'bubble',size:'mega',
      header:{type:'box',layout:'vertical',backgroundColor:'#173C32',paddingAll:'20px',contents:[
        {type:'text',text:'工商時報',weight:'bold',size:'xl',color:'#FFFFFF'},
        {type:'text',text:'每日新聞剪報  |  原圖典藏',size:'xs',color:'#C3DFD5',margin:'xs'}]},
      body:{type:'box',layout:'vertical',spacing:'md',contents:[
        {type:'text',text:dateText+'  精選報導',weight:'bold',size:'md',color:'#1D3331'},
        {type:'text',text:'依照追蹤關鍵字，收錄 '+images.length+' 則相關新聞。',size:'sm',wrap:true,color:'#50615D'},
        {type:'separator',margin:'md',color:'#E7EDEB'},
        {type:'text',text:'原圖畫質・雙指縮放・歷史查閱・整批下載',size:'xs',wrap:true,color:'#65736D'}]},
      footer:{type:'box',layout:'vertical',spacing:'sm',contents:[
        {type:'button',style:'primary',height:'sm',color:'#176B57',action:{type:'uri',label:'開啟每日剪報',uri:pageUrl}},
        {type:'button',style:'primary',height:'sm',color:'#286BA6',action:{type:'uri',label:'分享新聞給好友',uri:pageUrl+'&share=1'}},
        {type:'button',style:'primary',height:'sm',color:'#7156A4',action:{type:'uri',label:'調整追蹤關鍵字',uri:location.origin+location.pathname.replace(/[^/]*$/,'')+'keywords.html'}}]}
    }};
}
async function shareToLine(){
  shareStatus.textContent='正在開啟 LINE 好友選擇視窗…';
  shareButton.disabled=true;
  try{
    if(!displayedDate||!images.length) throw new Error('剪報尚未載入完成，請稍候重試。');
    await ensureLiff();
    if(!window.liff.isLoggedIn()){
      shareStatus.textContent='正在導向 LINE 登入…';
      window.liff.login({redirectUri:location.href});
      return;
    }
    if(window.liff.isApiAvailable && !window.liff.isApiAvailable('shareTargetPicker')){
      throw new Error('此環境不支援 LINE 圖文分享，請透過 LINE 開啟此 LIFF 連結。');
    }
    const result=await window.liff.shareTargetPicker([buildShareCard()],{isMultiple:true});
    shareStatus.textContent=result?.status==='success'?'圖文剪報已分享成功。':'已取消分享，未傳送任何訊息。';
  }catch(err){
    shareStatus.textContent='無法分享：'+(err?.message||String(err));
  }finally{shareButton.disabled=false;}
}
document.querySelector('#showShareBtn').addEventListener('click',()=>{sharePanel.hidden=false;sharePanel.scrollIntoView({behavior:'smooth',block:'nearest'});});
shareButton.addEventListener('click',shareToLine);
if(queryShare) sharePanel.hidden=false;
if(liffId) ensureLiff().catch(err=>{shareStatus.textContent='LINE 分享初始化失敗：'+err.message;});
else shareStatus.textContent='尚未設定 LIFF ID；無法分享圖文卡片，且不會改成純文字傳送。';
function setMode(newMode){
  mode=newMode==='grid'?'grid':'flow';
  gallery.classList.toggle('flow',mode==='flow');
  flowBtn.classList.toggle('active',mode==='flow');gridBtn.classList.toggle('active',mode==='grid');
  flowBtn.setAttribute('aria-pressed',String(mode==='flow'));gridBtn.setAttribute('aria-pressed',String(mode==='grid'));
  for(const img of gallery.querySelectorAll('img[data-full]')){
    const next=img.dataset.full;
    if(img.getAttribute('src')!==next)img.src=next;
  }
  try{localStorage.setItem('ctee-viewer-mode',mode)}catch(e){}
}
flowBtn.addEventListener('click',()=>setMode('flow'));
gridBtn.addEventListener('click',()=>setMode('grid'));
dateSelect.addEventListener('change',()=>{
  const next=new URL(location.href);
  if(dateSelect.value)next.searchParams.set('date',dateSelect.value);
  else next.searchParams.delete('date');
  location.assign(next.toString());
});
function el(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}
function openGallery(i){if(lightbox){lightbox.loadAndOpen(i);return}window.open(images[i].src,'_blank','noopener')}
function render(){
  gallery.replaceChildren();
  images.forEach((item,i)=>{
    const card=el('article','item');
    const btn=el('button','image-btn');btn.type='button';btn.setAttribute('aria-label','放大第 '+(i+1)+' 張剪報');
    const img=el('img');img.className='clipping-image';
    img.dataset.full=item.src;
    img.src=item.src;
    img.alt='第 '+(i+1)+' 張剪報：'+(item.keyword||'');img.loading=i<2?'eager':'lazy';img.decoding='async';
    btn.append(img);btn.addEventListener('click',()=>openGallery(i));
    const meta=el('div','meta');
    const info=el('div','title');
    info.append(el('span','number',String(i+1).padStart(2,'0')+' / '+images.length+' · '));
    info.append(document.createTextNode(item.keyword||'剪報'));
    const resolution=el('div','','原圖 '+item.width+'×'+item.height);resolution.style.color='#7a858d';resolution.style.fontSize='11px';
    info.append(resolution);
    const link=el('a','download','下載原圖');link.href=item.src;
    link.download=item.src.split('/').pop();
    link.setAttribute('aria-label','下載第 '+(i+1)+' 張來源原圖');
    meta.append(info,link);card.append(btn,meta);gallery.append(card);
  });
}
try{
  try{mode=localStorage.getItem('ctee-viewer-mode')||'flow'}catch(e){}
  gallery.classList.toggle('flow',mode!=='grid');
  flowBtn.classList.toggle('active',mode!=='grid');gridBtn.classList.toggle('active',mode==='grid');
  const dataPath=validDate?'archive/'+selected+'/data.json':'data.json';
  const r=await fetch(dataPath+'?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('剪報資料 HTTP '+r.status);
  const data=await r.json();
  if(!Array.isArray(data.images)||data.images.length===0)throw Error('該日期尚無有效剪報');
  images=data.images;displayedDate=data.date;
  document.querySelector('#headline').textContent=(data.date_label||data.date)+' 工商時報剪報';
  document.querySelector('#subtitle').textContent='收錄 '+images.length+' 張 · 原始畫質 · 歷史日期可切換';
  document.querySelector('#countBadge').textContent=images.length+' 張原圖';
  const zip=data.zip||'latest.zip';
  document.querySelector('#topDownload').href=zip;
  document.querySelector('#zipBtn').href=zip;
  render();setMode(mode);
  try{
    const hr=await fetch('history.json?ts='+Date.now(),{cache:'no-store'});
    if(!hr.ok)throw Error('history index not ready');
    const history=await hr.json();
    dateSelect.replaceChildren();
    const days=Array.isArray(history.dates)?history.dates:[];
    for(const day of days){
      const opt=document.createElement('option');opt.value=day.date;
      opt.textContent=day.date.replaceAll('-','/')+' · '+day.count+' 張';
      dateSelect.append(opt);
    }
    if(!days.some(day=>day.date===displayedDate)){
      const opt=document.createElement('option');opt.value=displayedDate;opt.textContent=data.date_label;
      dateSelect.prepend(opt);
    }
    dateSelect.value=displayedDate;
  }catch(e){
    dateSelect.replaceChildren();
    const opt=document.createElement('option');opt.value=displayedDate;opt.textContent=data.date_label||displayedDate;dateSelect.append(opt);
  }
  try{
    const {default:PhotoSwipeLightbox}=await import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js');
    lightbox=new PhotoSwipeLightbox({
      dataSource:images.map(item=>({src:item.src,width:item.width,height:item.height,alt:item.keyword||'剪報原圖'})),
      pswpModule:()=>import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js'),
      bgOpacity:.95,pinchToClose:false
    });
    lightbox.on('uiRegister',()=>{
      lightbox.pswp.ui.registerElement({name:'download-button',order:8,isButton:true,tagName:'a',html:'下載原圖',onInit:(button,pswp)=>{
        const update=()=>{const i=pswp.currIndex;button.href=images[i].src;button.download=images[i].src.split('/').pop();button.title='下載來源原圖'};
        pswp.on('change',update);update();
      }});
    });
    lightbox.init();
  }catch(err){console.warn('PhotoSwipe 無法載入，改以新分頁開原圖',err)}
  document.querySelector('#openBtn').addEventListener('click',()=>openGallery(0));
}catch(err){
  gallery.replaceChildren(el('div','status','暫時無法載入剪報：'+err.message));
  document.querySelector('#countBadge').textContent='無資料';
  document.querySelector('#openBtn').disabled=true;
}
</script>
</body></html>
